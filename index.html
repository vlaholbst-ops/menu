<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="description" content="Личное меню Владимира на неделю">
  <title>Меню Владимира</title>
  <script src="https://accounts.google.com/gsi/client" async defer></script>
  <style>
    :root{
      --navy:#152138;--paper:#fffdf8;--cream:#f7f3ea;--ink:#182033;--muted:#697287;
      --line:#dfe2e7;--gold:#f6bd4f;--green:#28745d;--green-soft:#e2f2ec;
      --berry:#ad3154;--danger:#a83b3b;--shadow:0 10px 28px rgba(21,33,56,.08);
      --sans:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;
      --mono:"SFMono-Regular",Consolas,monospace;
    }
    *{box-sizing:border-box}
    html{scroll-behavior:smooth}
    body{margin:0;background:var(--cream);color:var(--ink);font-family:var(--sans);line-height:1.45;-webkit-font-smoothing:antialiased}
    button,textarea{font:inherit}
    button:focus-visible,summary:focus-visible,textarea:focus-visible{outline:3px solid rgba(246,189,79,.78);outline-offset:3px}
    .shell{max-width:820px;margin:0 auto;padding:14px 16px 120px}
    .dayswrap{position:sticky;top:0;z-index:10;background:rgba(247,243,234,.94);backdrop-filter:blur(14px);padding:10px 0 12px}
    .days{display:grid;grid-template-columns:repeat(7,1fr);gap:8px}
    .daytab{border:1px solid var(--line);background:var(--paper);color:var(--muted);border-radius:13px;padding:11px 5px;cursor:pointer;font-weight:850}
    .daytab[aria-selected="true"]{background:var(--gold);border-color:var(--gold);color:var(--navy)}
    .datehint{margin:8px 2px 0;color:var(--muted);font-size:.76rem}
    .meals{display:grid;gap:12px;margin-top:4px}
    .meal{background:var(--paper);border:1px solid var(--line);border-radius:18px;box-shadow:var(--shadow);overflow:hidden;transition:border-color .16s,opacity .16s}
    .meal.eaten{border-color:#9ecfbd}
    .mealmain{display:grid;grid-template-columns:46px 1fr auto;gap:12px;align-items:start;padding:17px}
    .check{width:42px;height:42px;border:2px solid #aeb5c1;border-radius:13px;background:white;color:transparent;cursor:pointer;font-size:1.35rem;font-weight:900;line-height:1}
    .check[aria-pressed="true"]{background:var(--green);border-color:var(--green);color:white}
    .mealname{font-size:.75rem;color:var(--berry);font-weight:900;letter-spacing:.08em;text-transform:uppercase}
    .dish{margin-top:3px;font-size:1.06rem;font-weight:850}
    .macros{font:800 .76rem var(--mono);color:var(--muted);white-space:nowrap;padding-top:3px}
    details{border-top:1px solid var(--line)}
    summary{list-style:none;cursor:pointer;padding:13px 17px;color:var(--navy);font-size:.86rem;font-weight:850}
    summary::-webkit-details-marker{display:none}
    summary:before{content:"＋";display:inline-block;width:22px;color:var(--green);font-weight:900}
    details[open] summary:before{content:"−"}
    .recipe{padding:0 17px 17px;display:grid;grid-template-columns:1fr;gap:12px}
    .recipe.withphoto{grid-template-columns:145px 1fr}
    .recipe img{width:145px;height:145px;object-fit:cover;border-radius:13px}
    .recipe h3{margin:0 0 6px;font-size:.78rem;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
    .recipe ul{margin:0;padding-left:18px;color:#555f73;font-size:.87rem}
    .recipe li{margin:4px 0}
    .method{margin:10px 0 0;font-size:.86rem;color:#555f73}
    .source{display:inline-block;margin-top:10px;padding:4px 7px;border-radius:7px;background:var(--green-soft);color:var(--green);font-size:.7rem;font-weight:850}
    .source.estimate{background:#fff1c9;color:#79560f}
    .savebox{margin-top:16px;background:var(--navy);color:white;border-radius:20px;padding:18px;box-shadow:var(--shadow)}
    .savebox label{display:block;font-size:.82rem;font-weight:850;margin-bottom:7px}
    textarea{display:block;width:100%;min-height:92px;resize:vertical;border:1px solid rgba(255,255,255,.18);border-radius:13px;padding:12px;background:rgba(255,255,255,.08);color:white}
    textarea::placeholder{color:#aeb8ca}
    .actions{display:grid;grid-template-columns:1fr auto;gap:10px;margin-top:12px}
    #saveDay{border:0;border-radius:13px;background:var(--gold);color:var(--navy);padding:13px 16px;font-weight:900;cursor:pointer}
    #saveDay:disabled{opacity:.62;cursor:wait}
    .journal{display:grid;place-items:center;border:1px solid rgba(255,255,255,.2);border-radius:13px;color:white;text-decoration:none;padding:0 15px;font-weight:800;font-size:.82rem}
    .syncstate{min-height:18px;margin:10px 1px 0;color:#cbd3e1;font-size:.76rem}
    .syncstate.bad{color:#ffb7b7}
    .toast{position:fixed;left:50%;bottom:24px;z-index:30;transform:translate(-50%,20px);opacity:0;pointer-events:none;background:#111a2c;color:white;border-radius:12px;padding:11px 15px;box-shadow:var(--shadow);transition:.2s;white-space:nowrap;font-size:.84rem}
    .toast.on{opacity:1;transform:translate(-50%,0)}
    @media(max-width:620px){
      .shell{padding:8px 10px 110px}.days{overflow-x:auto;grid-template-columns:repeat(7,54px);padding-bottom:2px}
      .mealmain{grid-template-columns:42px 1fr;gap:10px;padding:14px}.macros{grid-column:2;padding:0}.recipe.withphoto{grid-template-columns:1fr}.recipe img{width:100%;height:auto;aspect-ratio:16/10}.actions{grid-template-columns:1fr}.journal{min-height:44px}.toast{max-width:calc(100vw - 24px);white-space:normal;text-align:center}
    }
  </style>
</head>
<body>

  <main>

      <p class="syncstate" id="syncState" role="status" aria-live="polite"></p>

</div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

      (recipe.img?'<img src="'+recipe.img+'" alt="'+esc(meal.dish)+'" loading="lazy">':"")+
      '<div><h3>Порция</h3><ul>'+meal.portion.map(function(x){return"<li>"+esc(x)+"</li>"}).join("")+'</ul>'+
      '<h3 style="margin-top:13px">Ингредиенты</h3><ul>'+recipe.ingredients.map(function(x){return"<li>"+esc(x)+"</li>"}).join("")+'</ul>'+
      '<p class="method">'+esc(recipe.method)+'</p><span class="source'+sourceClass+'">'+esc(recipe.source)+'</span></div></div>';
  }
  function renderMeals(){
    var day=WEEK[selected],st=currentState();
    mealsEl.innerHTML=day.meals.map(function(meal,index){
      return '<article class="meal '+(st.done[index]?"eaten":"")+'"><div class="mealmain">'+
        '<button class="check" type="button" data-check="'+index+'" aria-pressed="'+st.done[index]+'" aria-label="'+(st.done[index]?"Отменить отметку":"Отметить как съеденное")+'">✓</button>'+
        '<div><div class="mealname">'+esc(meal.name)+'</div><div class="dish">'+esc(meal.dish)+'</div></div>'+
        '<div class="macros">'+meal.kcal+' ккал · Б '+meal.protein+'</div></div>'+
        '<details><summary>Рецепт и порция</summary>'+recipeMarkup(meal)+'</details></article>';
    }).join("");
    mealsEl.querySelectorAll("[data-check]").forEach(function(button){
      button.addEventListener("click",function(){
        var index=Number(button.getAttribute("data-check"));
        st.done[index]=!st.done[index];persist();renderMeals();updateSaveButton();
      });
    });
    commentEl.value=st.comment||"";
  }
  function updateSaveButton(){
    var st=currentState();
    saveButton.disabled=saving||st.googleSaved;
    saveButton.textContent=saving?"Синхронизирую…":st.googleSaved?"День в журнале ✓":"Синхронизировать день";
  }
  function render(){
    renderTabs();renderMeals();updateSaveButton();
    document.getElementById("dateHint").textContent="Сегодня "+iso+" · выбрано меню: "+WEEK[selected].day.toLowerCase();
    syncState.textContent=currentState().googleSaved?"Данные за сегодня уже записаны в лист «Питание».":"Отметьте съеденное и сохраните день одним нажатием.";
    syncState.classList.remove("bad");
  }
  commentEl.addEventListener("input",function(){currentState().comment=commentEl.value;persist()});

  function requestGoogleToken(){
    return new Promise(function(resolve){
      if(googleToken&&Date.now()<googleTokenExpiresAt-60000){resolve(googleToken);return}
      googleToken=null;googleTokenExpiresAt=0;
      if(!window.google||!google.accounts||!google.accounts.oauth2){resolve(null);return}
      var finished=false;
      var timer=setTimeout(function(){finish(null)},12000);
      function finish(token){if(finished)return;finished=true;clearTimeout(timer);resolve(token)}
      var client=google.accounts.oauth2.initTokenClient({
        client_id:GOOGLE_CLIENT_ID,scope:GOOGLE_SCOPE,
        callback:function(response){
          if(response.error||!response.access_token){finish(null);return}
          googleToken=response.access_token;
          googleTokenExpiresAt=Date.now()+(Number(response.expires_in)||3600)*1000;
          finish(googleToken);
        },
        error_callback:function(){finish(null)}
      });
      try{client.requestAccessToken({prompt:"select_account"})}catch(e){finish(null)}
    });
  }
  async function googleRequest(token,url,options){
    options=options||{};options.headers=Object.assign({},options.headers||{},{"Authorization":"Bearer "+token});
    var controller=window.AbortController?new AbortController():null;
    var timer=setTimeout(function(){if(controller)controller.abort()},12000);
    if(controller)options.signal=controller.signal;
    try{
      var response=await fetch(url,options);
      if(!response.ok){if(response.status===401||response.status===403){googleToken=null;googleTokenExpiresAt=0}throw new Error("Google Sheets: "+response.status)}
      return response.status===204?{}:response.json();
    }finally{clearTimeout(timer)}
  }
  function valuesUrl(range){
    return"https://sheets.googleapis.com/v4/spreadsheets/"+GOOGLE_SPREADSHEET_ID+"/values/"+encodeURIComponent(range);
  }
  async function ensureFoodSheet(token){
    var base="https://sheets.googleapis.com/v4/spreadsheets/"+GOOGLE_SPREADSHEET_ID;
    var meta=await googleRequest(token,base+"?fields=sheets.properties.title");
    var exists=(meta.sheets||[]).some(function(sheet){return sheet.properties&&sheet.properties.title===GOOGLE_SHEET_NAME});
    if(!exists){
      await googleRequest(token,base+":batchUpdate",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({requests:[{addSheet:{properties:{title:GOOGLE_SHEET_NAME,rowCount:1000,columnCount:SHEET_HEADERS.length}}}]})});
    }
    var current=await googleRequest(token,valuesUrl(GOOGLE_SHEET_NAME+"!A1:I1"));
    var header=(current.values||[])[0]||[];
    if(header.length&&JSON.stringify(header)!==JSON.stringify(SHEET_HEADERS))throw new Error("wrong-header");
    if(!header.length){
      await googleRequest(token,valuesUrl(GOOGLE_SHEET_NAME+"!A1:I1")+"?valueInputOption=RAW",{method:"PUT",headers:{"Content-Type":"application/json"},body:JSON.stringify({majorDimension:"ROWS",values:[SHEET_HEADERS]})});
    }
  }
  async function dayAlreadySaved(token){
    var body=await googleRequest(token,valuesUrl(GOOGLE_SHEET_NAME+"!A2:A"));
    return(body.values||[]).some(function(row){return String(row[0]||"")===iso});
  }
  function buildRows(){
    var st=currentState(),day=WEEK[selected],stamp=new Date().toISOString();
    return day.meals.map(function(meal,index){
      return[iso,day.day,meal.name,meal.dish,meal.kcal,meal.protein,st.done[index]?"Съедено":"Не съедено",st.comment||"",stamp];
    });
  }
  async function appendRows(token,rows){
    await googleRequest(token,valuesUrl(GOOGLE_SHEET_NAME+"!A:I")+":append?valueInputOption=USER_ENTERED&insertDataOption=INSERT_ROWS",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({majorDimension:"ROWS",values:rows})});
  }
  async function saveDay(){
    var st=currentState();
    if(saving||st.googleSaved)return;
    if(!st.done.some(Boolean)&&!String(st.comment||"").trim()){toast("Отметьте еду или оставьте комментарий");return}
    saving=true;updateSaveButton();syncState.textContent="Подключаю Google-журнал…";syncState.classList.remove("bad");
    try{
      var token=await requestGoogleToken();
      if(!token)throw new Error("no-token");
      await ensureFoodSheet(token);
      if(await dayAlreadySaved(token)){
        st.googleSaved=true;persist();toast("Сегодняшний день уже есть в журнале");
      }else{
        await appendRows(token,buildRows());
        st.googleSaved=true;persist();toast("День записан в Google Таблицу");
      }
      syncState.textContent="Данные за сегодня записаны в лист «Питание».";
    }catch(error){
      syncState.classList.add("bad");
      syncState.textContent=error&&error.message==="wrong-header"?"Лист «Питание» уже есть, но его структура отличается. Ничего не записано.":"Google не ответил. Отметки остались на этом устройстве.";
      toast("Не удалось синхронизировать — попробуйте ещё раз");
    }finally{saving=false;updateSaveButton()}
  }
  saveButton.addEventListener("click",saveDay);
  render();
})();
</script>
</body>
</html>
